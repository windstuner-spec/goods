<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>굿즈 계산기 — 다모아</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#141c33">
<style>
/* ===== 다모아 공용 토큰 (ui_tokens — 바람문고도 같은 것을 쓴다) ===== */
:root{
  --navy:#141c33; --navy2:#1d2947; --gold:#c9a45c; --gold2:#e2c78e;
  --ink:#16203a; --muted:#8b93a3; --paper:#eef0f4; --card:#fff; --line:#e3e6ec;
  --accent:#2d6cdf; --ok:#1e8e54; --warn:#b8860b; --danger:#c0392b;
  /* 본문 최대 폭 — **모든 화면이 같다** (UI v1.6, 2026-10-16, 사용자 요청 — "최대폭을 정해놓고 접속한 매체에
     따라서 반응형으로 … 모두 일정하면 좋을 것 같아"). 예전엔 화면마다 ui_page_open(['max'=>…]) 로 달리 줘서
     560·720·760·900·1000·1080·1100·1180·1240·1280·1320 **열한 가지**였다 — 화면을 옮길 때마다 글이 시작하는
     자리가 바뀌었다. 가장 넓은 표(아파트 실거래가)가 들어가는 값으로 맞췄다.
     **화면에서 이 값을 다시 정하지 말 것** — 그러면 다시 제각각이 된다. */
  /* 글자 크기 단계(UI v1.9). 장식 이모지와 표지 그림 크기는 별도다. */
  --fs-xs:11px; --fs-s:12px; --fs-m:13px; --fs-base:14.5px; --fs-l:17px; --fs-xl:21px;
  --page-max:1320px;
  /* 좌우 여백 — 이것이 '반응형' 을 맡는다. .wrap 이 max-width 라서 화면이 좁으면 저절로 줄고,
     그 안에서 여백만 화면 너비를 따라간다(휴대폰 16px → 큰 화면 32px 에서 멈춤). */
  --gutter:clamp(16px,4vw,32px);
  --bar-h:58px;
  --top-h:var(--bar-h);   /* 지금 화면 위에 붙어 있는 높이(바 + 탭). 숨기면 0 — 붙는(sticky) 요소는 이만큼 띄운다 (UI v1.5) */
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  /* 스크롤바 자리를 늘 비워 둔다 (UI v1.6) — 안 그러면 **스크롤이 생기는 화면과 안 생기는 화면의 본문이
     7px 어긋난다**(1,600px 창에서 왼쪽 133 ↔ 140). 화면을 옮길 때 글이 들썩이던 것이 이것이다.
     :root 가 곧 html 이라 여기 적으면 걸리고, 공용 CSS 를 안 싣는 바람문고도 ui_tokens() 로 함께 받는다.
     모르는 브라우저는 예전처럼 동작할 뿐이라 깨지지 않는다. */
  scrollbar-gutter:stable;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
     font-family:var(--sans);font-size:14.5px;line-height:1.6}

/* ===== 상단 띠 =====
   **스크롤해도 늘 보인다**(UI v1.5, 2026-10-14, 사용자 — "상단 띠는 계속 보이게 하면서 숨기는 버튼").
   붙어 있는 것은 바(.tbar)와 탭뿐이다 — 포털 인사말·주식 앱 띠 같은 `below` 는 바깥 .top-below 로 꺼내
   스크롤하면 위로 지나간다(통째로 붙이면 화면 절반을 가린다).
   둘로 나뉘어도 이음매가 안 보이게 **색은 가로(90deg) 그라데이션**이다 — 대각선이면 높이가 다른 두 상자의 색이 어긋난다.
   바 끝 ▴ 로 숨기면 위 가장자리에 ▾ 손잡이만 남는다. 고른 것은 이 브라우저에 기억한다(ui.bar). */
html{scroll-padding-top:var(--top-h)}            /* #주소로 뛰어도 붙은 바 밑에 숨지 않게 */
.top{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#eef1f8;position:sticky;top:0;z-index:40}
.top-below{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#eef1f8}
html.ui-bar-off .top{display:none}
.tbar .ui-hide{flex:none;appearance:none;-webkit-appearance:none;border:0;background:rgba(255,255,255,.08);color:#c6cede;
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:12px;line-height:1;padding:0;font-family:inherit}
.tbar .ui-hide:hover{background:rgba(255,255,255,.16);color:#fff}
.ui-show{display:none;position:fixed;top:0;right:max(12px,calc((100vw - var(--page-max)) / 2 + var(--gutter)));z-index:41;
  appearance:none;-webkit-appearance:none;border:0;cursor:pointer;font-family:inherit;
  background:var(--navy);color:var(--gold2);font-size:12px;font-weight:600;padding:3px 13px 5px;border-radius:0 0 10px 10px;
  box-shadow:0 4px 12px rgba(20,28,51,.25)}
html.ui-bar-off .ui-show{display:block}
@media print{.top{position:static}.ui-show,.tbar .ui-hide{display:none}}
.tbar{max-width:var(--page-max);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:11px;height:var(--bar-h)}   /* 여백을 안쪽에 — 본문(.wrap)과 글자 줄이 맞는다 */
.tbar .mark{font-size:19px;flex:none;line-height:1}
.tbar h1{font-size:16.5px;margin:0;flex:1;font-weight:700;min-width:0;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .u{font-size:12px;color:#c6cede;flex:none}
.tbar a{color:var(--gold2);font-size:12.5px;text-decoration:none;font-weight:600;flex:none}
.tbar a:hover{color:#fff}
.tabs{max-width:var(--page-max);margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.top .tabs{padding:0 var(--gutter)}   /* 여백은 머리띠 안의 탭에만 — 본문에서 .tabs 이름을 쓰는 알약 줄까지 들여 쓰였다 */
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:#aab3c7;font-family:inherit;font-size:13.5px;font-weight:600;
  padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--gold)}

/* ===== 본문 =====
   폭은 --page-max 하나로 모든 화면이 같다(UI v1.6). 화면 CSS 에서 .wrap 의 max-width 를 다시 쓰지 말 것.
   좌우 여백은 --gutter. 예전엔 4vw 라서, 최대 폭(여백 포함) 안의 내용이 화면이 넓을수록 오히려 좁아졌다
   (1,400px 창 1,208px → 1,920px 전체화면 1,166px). 넓은 화면에서는 32px 에서 멈춘다 (UI v1.2)

   **내용이 한 칸뿐인 화면은 .wrap.narrow 로 가운데 모은다** — 알림·앱 받기처럼 글과 단추뿐인 화면을
   1,320px 로 펼치면 한 줄이 너무 길어 읽기 어렵다. 폭(바깥 테두리)은 그대로 두고 **안쪽 내용만** 좁히는
   것이라 상단 띠·본문 시작 자리는 다른 화면과 어긋나지 않는다. ui_main_open(['narrow'=>true]) 로 켠다. */
.wrap{max-width:var(--page-max);margin:18px auto 60px;padding:0 var(--gutter)}
.wrap.narrow>*{max-width:760px;margin-left:auto;margin-right:auto}

/* ===== 카드 ( .sec / .panel 은 기존 페이지 호환용 별칭 ) ===== */
.card,.sec,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:17px 19px;margin-bottom:16px;box-shadow:0 3px 12px rgba(22,32,58,.05)}
.card>h2,.sec>h2{font-size:15px;margin:0 0 4px}
.card>h3,.panel>h3{font-size:14px;margin:0 0 12px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;display:block;margin-bottom:12px}
/* 접어 두는 설명(UI v1.8, 2026-10-29, 사용자 — "쓸데없는 설명이 작은 글씨로 적혀있는 경우가 많아").
   계산 방법·주의·자료 출처 같은 긴 설명에 .help 를 달면 기본으로 숨고, 그런 글이 있는 화면에만
   머리띠에 'ⓘ 설명' 단추가 생겨 한꺼번에 편다(ui_page_close 의 스크립트, 켬은 이 브라우저에 기억 — 모든 화면 공통) */
html:not(.ui-help-on) .help{display:none!important}
/* 머리띠 링크(⌂ 포털 등)와 같은 글자 — 예전엔 띠 글자(더 큼)를 이어받아 혼자 커 보였다(2026-11-01, 사용자) */
.tbar .ui-help{appearance:none;border:0;background:none;font-family:inherit;color:var(--gold2);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;flex:none;line-height:inherit}   /* 단추는 line-height 가 normal 이라 ⌂ 포털(a)보다 글자가 1.5px 낮았다(2026-11-06, 사용자 — "줄이 안맞다") */
.tbar .ui-help:hover{color:#fff}
html.ui-help-on .tbar .ui-help{text-decoration:underline}
.tbar .ui-split{appearance:none;border:0;background:none;font-family:inherit;color:var(--gold2);font-size:var(--fs-l);cursor:pointer;padding:0;flex:none;line-height:inherit}
.tbar .ui-split:hover{color:var(--card)}

/* ===== 통계 타일 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.st .k{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.st .v{font-size:17px;font-weight:700;line-height:1.3}
.st .v small{font-size:11px;font-weight:400;color:var(--muted)}

/* ===== 버튼 ===== */
.btn{padding:8px 15px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);
  font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;line-height:1.4}
.btn:hover{border-color:#bcc6d8}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2)}
.btn.danger{color:var(--danger);border-color:#f0c8c8}
.btn.danger:hover{background:#fdf3f3}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500}
.btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}

/* ===== 입력 ===== */
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:#b3bac7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.frow label{font-size:11px;color:var(--muted)}
.frow label>input,.frow label>select{display:block;margin-top:3px}

/* ===== 알림·상태 ===== */
.sync{font-size:11.5px;color:var(--muted)}
.sync.err{color:var(--danger)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;
  cursor:pointer;user-select:none;background:#fff;margin:0 6px 6px 0}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:7px;padding:3px 8px}
.note{background:#fff4f4;border:1px solid #f0c8c8;color:#8a2b2b;border-radius:14px;
  padding:14px 16px;font-size:13px;line-height:1.7;margin-bottom:16px}
.warnbox{background:#fff8e6;border:1px solid #f0dfae;color:#7a5c12;border-radius:var(--r);
  padding:10px 13px;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 10px;line-height:1.8}

/* ===== 가운데 놓인 인증 카드 (회원가입·비밀번호 변경) =====
   body 에 class="auth" 를 주면 화면 한가운데 정렬된다 */
body.auth{display:flex;align-items:center;justify-content:center;padding:24px 0}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:30px 27px;width:min(380px,92vw);box-shadow:0 8px 30px rgba(22,32,58,.08);margin:0}
.authcard h1{font-size:19px;margin:0 0 4px}
.authcard .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.authcard label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}
.authcard input{width:100%;padding:12px 14px;margin-bottom:11px;font-size:15px;border-radius:10px}
.authcard button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--navy);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.authcard button:hover{background:var(--navy2)}
.authcard .switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.authcard .switch a{color:var(--accent);text-decoration:none;font-weight:600}
.msg-err{background:#fdeaea;color:var(--danger);border:1px solid #f3c1c1;
  border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:12px}
.msg-ok{background:#eafaf0;color:var(--ok);border:1px solid #bfe8cf;
  border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:12px}

/* ===== 접근성·모바일 ===== */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){
  .tbar{gap:8px}
  .tbar .u{display:none}
  .card,.sec,.panel{padding:14px 15px;border-radius:14px}
}

/* UI v1.9 — 요청한 다섯 화면만 새 단계와 입력 모양을 쓴다. 주식 앱은 기존 규칙을 유지한다. */
/* 단추·입력의 브라우저 기본 글자(13.3333px)를 걷는다(UI v1.9 후속, 2026-11-10). :where 로 감싸 우선순위 0 —
   .btn·.tabs button·.pair input 처럼 이미 글자를 정한 규칙은 그대로 이기고, 정하지 않은 단추·입력만 이 값을 받는다.
   body_class 가 다섯 화면에만 걸리므로 주식 앱(및 다른 화면)은 영향이 없다. */
:where(body:is(.home,.app-divstat,.app-music,.app-ev,.app-train)) :where(button,input,select,textarea){font-family:inherit;font-size:var(--fs-m)}
body.app-train input[type=time]{font-family:inherit;font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train){font-size:var(--fs-base)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tbar .ui-hide{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .ui-show{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tbar h1{font-size:var(--fs-l)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tbar .u{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tbar a{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tabs button{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .card>h2,body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .sec>h2{font-size:var(--fs-base)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .card>h3,body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .panel>h3{font-size:var(--fs-base)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .hint{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tbar .ui-help{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .st .k{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .st .v{font-size:var(--fs-l)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .st .v small{font-size:var(--fs-xs)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .btn{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .btn.sm{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) input[type=text],body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) input[type=number],body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) input[type=date],body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) input[type=password],body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) select,body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) textarea{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .frow label{font-size:var(--fs-xs)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .sync{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .pill{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .tag{font-size:var(--fs-xs)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .note{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .warnbox{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .empty{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .authcard h1{font-size:var(--fs-l)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .authcard .sub{font-size:var(--fs-m)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .authcard label{font-size:var(--fs-s)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .authcard input{font-size:var(--fs-base)}
body:is(.home,.app-divstat,.app-music,.app-ev,.app-train) .authcard button{font-size:var(--fs-base)}
